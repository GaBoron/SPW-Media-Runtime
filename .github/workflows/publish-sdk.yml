name: Publish SDK to Maven Central

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish a new version or inspect an interrupted deployment
        type: choice
        options: [publish, status]
        default: publish
      version:
        description: Must match gradle.properties in the selected ref
        required: true
        default: '0.2.0'
      deployment_id:
        description: Required for status; use the ID printed by the previous upload
        required: false

permissions:
  contents: read

concurrency:
  group: maven-central-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Check version and namespace
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')"
          group="$(sed -n 's/^group=//p' gradle.properties | tr -d '\r')"
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$REQUESTED_VERSION" = "$version"
          test "$group" = 'io.github.gaboron.spwmedia'
      - name: Inspect existing deployment
        if: inputs.operation == 'status'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: bash ./gradlew centralDeploymentStatus "-PdeploymentId=$DEPLOYMENT_ID" --no-daemon --console=plain --no-problems-report
      - name: Build, test and inspect SDK publications
        if: inputs.operation == 'publish'
        run: bash ./gradlew checkSdkArtifacts consumerFixture checkExample --no-daemon --console=plain --no-problems-report
      - name: Sign and inspect all publication signatures
        if: inputs.operation == 'publish'
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: bash ./gradlew checkSignedSdkArtifacts -PcentralRelease=true --no-daemon --console=plain --no-problems-report
      - name: Publish and wait for Central
        if: inputs.operation == 'publish'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: bash ./gradlew publishSdkToCentral -PcentralRelease=true --no-daemon --console=plain --no-problems-report
      - name: Resolve published modules with a fresh cache
        if: inputs.operation == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if bash ./gradlew --gradle-user-home "$RUNNER_TEMP/central-consumer-$GITHUB_RUN_ID" \
              -p verification/consumer-fixture checkPublicModules fixture \
              "-PsdkVersion=$REQUESTED_VERSION" -PsdkGroup=io.github.gaboron.spwmedia \
              --refresh-dependencies --no-daemon --console=plain --no-problems-report; then
              exit 0
            fi
            sleep 30
          done
          echo 'Central publication completed but consumer resolution is not yet confirmed; do not republish this version.' >&2
          exit 1
      - name: Build the Kotlin consumer plugin from Central
        if: inputs.operation == 'publish'
        run: >-
          bash ./gradlew --gradle-user-home "$RUNNER_TEMP/central-consumer-$GITHUB_RUN_ID"
          -p examples plugin "-PsdkVersion=$REQUESTED_VERSION" -PsdkGroup=io.github.gaboron.spwmedia
          --no-daemon --console=plain --no-problems-report
